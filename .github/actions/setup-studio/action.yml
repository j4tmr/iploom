name: Setup Studio toolchain
description: Install pinned Bun and Node.js versions and optionally install frozen dependencies.

inputs:
  install:
    description: Run bun install --frozen-lockfile after setting up runtimes.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .node-version
    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
