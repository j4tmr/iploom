version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
      major:
        update-types:
          - major
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-pages-actions:
        patterns:
          - actions/configure-pages
          - actions/upload-pages-artifact
          - actions/deploy-pages
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - actions/configure-pages
          - actions/upload-pages-artifact
          - actions/deploy-pages
