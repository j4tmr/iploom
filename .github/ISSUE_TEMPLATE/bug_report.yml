name: Bug report
description: Report a reproducible IPloom Studio defect
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove private manuscripts, workspace paths, credentials and production assets before submitting.
        Security issues belong in the private security advisory flow, not here.
  - type: input
    id: version
    attributes:
      label: IPloom Studio version
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple silicon
        - macOS Intel
        - Windows 11 x64
        - Windows 10 x64
        - Built from source
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data where possible.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Sanitize paths, names and private content.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I removed private manuscripts, credentials and production assets.
          required: true
        - label: This is not a vulnerability report.
          required: true
