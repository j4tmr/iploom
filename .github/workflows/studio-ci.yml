name: Studio CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  quality:
    name: lint, typecheck, tests and release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run studio:build:release
      - name: Verify release inputs
        run: bun scripts/studio/verify-release-inputs.ts inputs
      - name: Verify download versions in documentation
        run: bun scripts/studio/verify-release-inputs.ts docs
      - run: bun run studio:verify-mcp

  desktop-smoke:
    name: desktop smoke (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run studio:build:release
      - run: bun run studio:smoke

  package-smoke:
    name: package smoke (${{ matrix.os }})
    needs: desktop-smoke
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run studio:dir
      - name: Verify macOS package
        if: runner.os == 'macOS'
        run: bun scripts/studio/verify-release-inputs.ts dir --platform darwin
      - name: Verify Windows package
        if: runner.os == 'Windows'
        run: bun scripts/studio/verify-release-inputs.ts dir --platform win32
      - run: bun run studio:smoke:package
      - run: bun run studio:verify-mcp --packaged
      - name: Confirm Rosetta 2 is available for the Intel slice
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          uname -m
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Smoke the Intel slice
        if: runner.os == 'macOS'
        run: bun scripts/studio/smoke.ts --packaged --arch x86_64
      - name: Verify MCP through the Intel slice
        if: runner.os == 'macOS'
        run: bun scripts/studio/verify-mcp.ts --packaged --arch x86_64
      - name: Upload package-smoke bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-ci-${{ runner.os }}-bundle
          path: |
            release/**/IPloom Studio.app/Contents/MacOS/IPloom Studio
            release/win-unpacked/IPloom Studio.exe
          if-no-files-found: error
          retention-days: 7
