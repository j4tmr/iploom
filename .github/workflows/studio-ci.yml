name: Studio CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  quality:
    name: lint, typecheck, tests and release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_desktop: ${{ steps.changes.outputs.run_desktop }}
      run_intel_smoke: ${{ steps.changes.outputs.run_intel_smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - uses: ./.github/actions/setup-studio
      - id: changes
        name: Classify CI scope
        run: bun scripts/studio/ci-changes.ts
      - run: bun run lint
      - name: Verify test isolation
        run: bun run studio:verify-test-isolation
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run studio:build:release
      - name: Verify release inputs
        run: bun scripts/studio/verify-release-inputs.ts inputs
      - name: Verify download versions in documentation
        run: bun scripts/studio/verify-release-inputs.ts docs
      - run: bun run studio:verify-mcp

  desktop-smoke:
    name: desktop smoke (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ needs.quality.outputs.run_desktop == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - name: Skip desktop smoke for docs-only PR
        if: needs.quality.outputs.run_desktop != 'true'
        env:
          TARGET_OS: ${{ matrix.os }}
        run: |
          echo "Skipping desktop smoke ($TARGET_OS): docs/site-only pull request"
      - if: needs.quality.outputs.run_desktop == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.quality.outputs.run_desktop == 'true'
        uses: ./.github/actions/setup-studio
      - if: needs.quality.outputs.run_desktop == 'true'
        run: bun run test
      - if: needs.quality.outputs.run_desktop == 'true'
        run: bun run studio:build:release
      - if: needs.quality.outputs.run_desktop == 'true'
        run: bun run studio:smoke

  package-smoke:
    name: package smoke (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ needs.quality.outputs.run_desktop == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Skip package smoke for docs-only PR
        if: needs.quality.outputs.run_desktop != 'true'
        env:
          TARGET_OS: ${{ matrix.os }}
        run: |
          echo "Skipping package smoke ($TARGET_OS): docs/site-only pull request"
      - if: needs.quality.outputs.run_desktop == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.quality.outputs.run_desktop == 'true'
        uses: ./.github/actions/setup-studio
      - if: needs.quality.outputs.run_desktop == 'true'
        run: bun run studio:dir
      - name: Verify macOS package
        if: runner.os == 'macOS' && needs.quality.outputs.run_desktop == 'true'
        run: bun scripts/studio/verify-release-inputs.ts dir --platform darwin
      - name: Verify Windows package
        if: runner.os == 'Windows' && needs.quality.outputs.run_desktop == 'true'
        run: bun scripts/studio/verify-release-inputs.ts dir --platform win32
      - if: needs.quality.outputs.run_desktop == 'true'
        run: bun run studio:smoke:package
      - if: needs.quality.outputs.run_desktop == 'true'
        run: bun run studio:verify-mcp --packaged
      - name: Skip Rosetta Intel-slice smoke for app/test-only PR
        if: runner.os == 'macOS' && needs.quality.outputs.run_desktop == 'true' && needs.quality.outputs.run_intel_smoke != 'true'
        run: |
          echo "Skipped Rosetta Intel-slice smoke: PR did not touch Electron, MCP, packaging, or dependencies (lipo universal slices and arm64 packaged smoke passed)."
      - name: Confirm Rosetta 2 is available for the Intel slice
        if: runner.os == 'macOS' && needs.quality.outputs.run_desktop == 'true' && needs.quality.outputs.run_intel_smoke == 'true'
        run: |
          set -euo pipefail
          uname -m
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Smoke the Intel slice
        if: runner.os == 'macOS' && needs.quality.outputs.run_desktop == 'true' && needs.quality.outputs.run_intel_smoke == 'true'
        run: bun scripts/studio/smoke.ts --packaged --arch x86_64
      - name: Verify MCP through the Intel slice
        if: runner.os == 'macOS' && needs.quality.outputs.run_desktop == 'true' && needs.quality.outputs.run_intel_smoke == 'true'
        run: bun scripts/studio/verify-mcp.ts --packaged --arch x86_64
